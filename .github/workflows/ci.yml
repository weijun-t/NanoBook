# ci.yml: continuous integration on GitHub Actions.
#
# What it does: On every push and pull request, builds and tests 6 presets (GCC and Clang, Debug
#   with ASan and UBSan, Release, and ThreadSanitizer), runs a short differential fuzz and smoke
#   runs of both benchmark tools, runs the libFuzzer target on the ITCH parser for 60 s, builds
#   the live viewer and runs its layout tests, and checks formatting (clang-format) and code
#   quality (clang-tidy, the viewer included).
#
# Why it exists: Every commit must build and pass its tests on both compilers (rule 21).
#
# Trade-offs: Clang 19, not 18 (the newest in Ubuntu 24.04 by default): GCC 14's standard library,
#   which Clang uses too, only offers std::expected when the compiler reports C++20 concepts as
#   202002, and Clang 18 reports 201907. The ITCH parser returns std::expected (phase 4).

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build + test every preset. Same command you run locally.
  build-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # TSan (phase 5): every test, the pipeline's threads included, under ThreadSanitizer.
        preset: [gcc-debug-asan, clang-debug-asan, gcc-release, clang-release, gcc-tsan, clang-tsan]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 clang-19

      # Newer runner kernels randomise memory layout more than older
      # ASan/TSan runtimes expect, which makes them crash or hang at startup.
      - name: Make sanitizers work on this kernel
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure, build, test
        run: cmake --workflow --preset ${{ matrix.preset }}

      # Differential fuzzer: random inputs through two books, every event compared. 100,000 ops
      # on each of 3 seeds. The long runs (10 million+) happen locally.
      - name: Fuzz smoke run
        if: endsWith(matrix.preset, 'release')
        run: ./build/${{ matrix.preset }}/nanobook_fuzz --ops 100000 --seeds 3

      # Proves the benchmark runs. These numbers come from a shared VM: never publish them.
      - name: Benchmark smoke run
        if: endsWith(matrix.preset, 'release')
        run: ./build/${{ matrix.preset }}/nanobook_microbench --benchmark_min_time=0.01s

      # Proves the latency harness runs every scenario on every book (counter flags, calibration,
      # tagging, 0 allocations while timing the fast books). Shared VM: never publish its numbers.
      - name: Latency harness smoke run
        if: endsWith(matrix.preset, 'release')
        run: |
          ./build/${{ matrix.preset }}/nanobook_bench --ops 20000 --csv "$RUNNER_TEMP/latency.csv"
          ./build/${{ matrix.preset }}/nanobook_bench --ops 20000 --throughput

  # libFuzzer (polish design Q6): random bytes and random valid operations into the ITCH parser
  # and two book builders, under ASan and UBSan, for 60 s. A crash or a disagreement fails the
  # job, and the failing input is uploaded so it can be replayed locally:
  #   build/clang-fuzz/nanobook_fuzz_itch crash-<hash>
  libfuzzer:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-19

      - name: Make sanitizers work on this kernel
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build
        run: |
          cmake --preset clang-fuzz
          cmake --build --preset clang-fuzz --target nanobook_fuzz_itch

      - name: Fuzz for 60 s
        run: |
          mkdir -p corpus
          ./build/clang-fuzz/nanobook_fuzz_itch -max_total_time=60 -print_final_stats=1 corpus

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: crash-*

  # The live viewer (viewer design §6): off in every preset, so it gets its own job. Builds
  # nanobook_view with FTXUI and runs its layout tests (frames drawn off-screen, no terminal).
  viewer:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14

      - name: Build
        run: |
          cmake --preset gcc-release -DNANOBOOK_BUILD_VIEWER=ON
          cmake --build build/gcc-release --target nanobook_view nanobook_depth nanobook_view_tests

      - name: Layout tests
        run: ./build/gcc-release/nanobook_view_tests

  # Fails if any file differs from .clang-format.
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-19

      - name: Check formatting
        run: git ls-files '*.hpp' '*.cpp' | xargs clang-format-19 --dry-run --Werror

      # A script committed as 100644 fails with "Permission denied" (exit 126) when run as
      # scripts/NAME.sh: viewer step 4 hit this on the bare-metal stick.
      - name: Check scripts are executable
        run: |
          bad=$(git ls-files -s 'scripts/*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$bad" ]; then echo "not executable (git update-index --chmod=+x): $bad"; exit 1; fi

  # Runs clang-tidy with .clang-tidy on our own code only (not _deps/).
  tidy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-19 clang-tidy-19

      # Configure only: produces compile_commands.json, which clang-tidy reads.
      - name: Configure
        run: >-
          cmake --preset clang-debug-asan -DNANOBOOK_BUILD_BENCH=ON -DNANOBOOK_BUILD_LIBFUZZER=ON
          -DNANOBOOK_BUILD_VIEWER=ON

      - name: Run clang-tidy
        run: run-clang-tidy-19 -quiet -p build/clang-debug-asan "$PWD/(src|tests|bench|tools|support|fuzz)/"
